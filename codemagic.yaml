workflows:
  android-test-apk:
    name: مساعد الزهايمر - Android test APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android and iOS project folders
        script: flutter create --platforms=android,ios --org com.alzheimerhelper .
      - name: Get Flutter dependencies
        script: flutter pub get
      - name: Build Android test APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
